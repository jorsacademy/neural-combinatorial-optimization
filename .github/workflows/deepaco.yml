name: DeepACO Hybrid

on:
  pull_request:
    paths:
      - "projects/deepaco-neural-metaheuristic-optimization/**"
      - ".github/workflows/deepaco.yml"
  push:
    branches: [main]
    paths:
      - "projects/deepaco-neural-metaheuristic-optimization/**"
      - ".github/workflows/deepaco.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/deepaco-neural-metaheuristic-optimization
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
